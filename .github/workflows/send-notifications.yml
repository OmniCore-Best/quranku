name: Send Prayer Notifications

on:
  schedule:
    - cron: '* * * * *' 
  workflow_dispatch:  

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call send notifications endpoint
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://quranku-test.vercel.app/api/cron/send-notifications 